name: Release
on:
  push:
    tags:
      - "v*"
jobs:
  release:
    name: Release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Code checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Setup Go
        uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6.2.0
        with:
          go-version: 1.24.11

      - name: Build release binaries
        env:
          CGO_ENABLED: 0
        run: |
          GOARCH=amd64 go build -o dist/wings_linux_amd64 -v -trimpath -ldflags="-s -w -X github.com/pterodactyl/wings/system.Version=${{ github.ref_name }}" github.com/pterodactyl/wings
          chmod 755 dist/wings_linux_amd64
          GOARCH=arm64 go build -o dist/wings_linux_arm64 -v -trimpath -ldflags="-s -w -X github.com/pterodactyl/wings/system.Version=${{ github.ref_name }}" github.com/pterodactyl/wings
          chmod 755 dist/wings_linux_arm64

      - name: Create release branch
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          BRANCH=release/${{ env.VERSION }}
          git config --local user.email "ci@pterodactyl.io"
          git config --local user.name "Pterodactyl CI"
          git checkout -b $BRANCH
          git push -u origin $BRANCH
          sed -i "s/var Version = \".*\"/var Version = \"${VERSION:1}\"/" system/const.go
          git add system/const.go
          git commit -m "ci(release): bump version"
          git push

      - name: write changelog
        run: |
          sed -n "/^## ${{ github.ref_name }}/,/^## /{/^## /b;p}" CHANGELOG.md > ./RELEASE_CHANGELOG

      - uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b # v2.5.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          draft: true
          prerelease: ${{ contains(github.ref_name, 'rc') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') }}
          body_path: ./RELEASE_CHANGELOG
          files: |
            dist/*

      # Update the release manifest in the pterodactyl-china/.github repository
      # (releases/latest.json). The release above is still a draft, so the
      # version cannot be read off the API. GITHUB_TOKEN deliberately cannot be
      # used here: it has no access to another repository. CDN_DISPATCH_TOKEN
      # must therefore be a PAT with write access to pterodactyl-china/.github.
      - name: Update release manifest (pterodactyl-china/.github)
        if: ${{ !contains(github.ref_name, 'rc') && !contains(github.ref_name, 'beta') && !contains(github.ref_name, 'alpha') }}
        env:
          GH_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
          VERSION: ${{ github.ref_name }}
        run: |
          # Normalise the tag (e.g. v1.13.1.0) to the manifest format (1.13.1.0).
          VERSION="${VERSION#v}"

          # Fetch the current manifest and its blob SHA from the main branch.
          MANIFEST="$(gh api repos/pterodactyl-china/.github/contents/releases/latest.json)"
          SHA="$(jq -r .sha <<<"$MANIFEST")"

          # Update the "wings" field and re-encode the payload to base64.
          CONTENT="$(jq -r .content <<<"$MANIFEST" | base64 -d | jq --arg v "$VERSION" '.wings = $v' | base64 -w 0)"

          # Commit the updated manifest back to the main branch.
          gh api -X PUT repos/pterodactyl-china/.github/contents/releases/latest.json \
            -f message="chore(release): bump wings version to ${VERSION}" \
            -f content="$CONTENT" \
            -f sha="$SHA" \
            -f branch="main"
