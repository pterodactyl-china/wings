name: Release
on:
  push:
    tags:
      - "v*"
jobs:
  release:
    name: Release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Code checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.2

      - name: Build release binaries
        env:
          CGO_ENABLED: 0
        run: |
          GOARCH=amd64 go build -o dist/wings_linux_amd64 -v -trimpath -ldflags="-s -w -X github.com/pterodactyl/wings/system.Version=${{ github.ref_name }}" github.com/pterodactyl/wings
          chmod 755 dist/wings_linux_amd64
          GOARCH=arm64 go build -o dist/wings_linux_arm64 -v -trimpath -ldflags="-s -w -X github.com/pterodactyl/wings/system.Version=${{ github.ref_name }}" github.com/pterodactyl/wings
          chmod 755 dist/wings_linux_arm64

      - name: Create release branch
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          BRANCH=release/${{ env.VERSION }}
          git config --local user.email "ci@pterodactyl.top"
          git config --local user.name "Pterodactyl China CI"
          git checkout -b $BRANCH
          git push -u origin $BRANCH
          sed -i "s/var Version = \".*\"/var Version = \"${VERSION:1}\"/" system/const.go
          git add system/const.go
          git commit -m "ci(release): bump version"
          git push

      - name: write changelog
        run: |
          sed -n "/^## ${{ github.ref_name }}/,/^## /{/^## /b;p}" CHANGELOG.md > ./RELEASE_CHANGELOG

      - uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b # v2.5.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          draft: true
          prerelease: ${{ contains(github.ref_name, 'rc') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') }}
          body_path: ./RELEASE_CHANGELOG
          files: |
            dist/*

      # 通知版本清单仓库 pterodactyl-china/.github，由它更新
      # https://api.pterodactyl.top/releases/latest.json 中的 wings 版本。
      # 上面创建的是 draft release，清单仓库无法通过 API 读到版本号，只能由这里主动告知。
      # GITHUB_TOKEN 无法跨仓库使用，需要 CDN_DISPATCH_TOKEN（对 .github 仓库有 Contents: Read and write 的 PAT）。
      - name: Update release manifest
        if: ${{ !contains(github.ref_name, 'rc') && !contains(github.ref_name, 'beta') && !contains(github.ref_name, 'alpha') }}
        env:
          GH_TOKEN: ${{ secrets.CDN_DISPATCH_TOKEN }}
          VERSION: ${{ github.ref_name }}
        run: |
          jq -n --arg version "$VERSION" \
            '{event_type: "release-tagged", client_payload: {component: "wings", version: $version}}' \
            | gh api repos/pterodactyl-china/.github/dispatches --input -
